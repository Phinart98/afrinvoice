<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800;900&family=Red+Hat+Text:wght@400;600&display=swap">
<style>
/* Share image in the site's ink style: heavy type on paper, colour only inside the mini invoices. */
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;background:#F3F4F7;color:#1B1F2E;font-family:'Red Hat Text',sans-serif;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding:64px 72px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;font:800 30px 'Red Hat Display';margin-bottom:36px}
h1{font:900 72px/1.02 'Red Hat Display';letter-spacing:-.035em}
p{margin-top:24px;font-size:26px;color:#4B5165}
.stack{display:flex;flex-direction:column;gap:16px}
.tile{background:#fff;border:2px solid #1B1F2E;border-radius:18px;padding:16px}
.k{display:flex;justify-content:space-between;font:800 18px 'Red Hat Display';margin-bottom:10px}.k span{font-weight:600;color:#4B5165}
.row{display:flex;justify-content:space-between;font-size:16px;color:#4B5165;padding:3px 0}
.h{font:900 20px 'Red Hat Display';letter-spacing:.02em;margin-bottom:6px}
.tot{display:flex;justify-content:space-between;color:#fff;font-weight:600;font-size:17px;padding:6px 10px;border-radius:5px;margin-top:6px}
</style></head>
<body>
<div>
  <div class="brand">
    <svg width="36" height="36" viewBox="0 0 26 26" fill="none"><rect x="3" y="1" width="16" height="21" rx="3" fill="#1B1F2E"/><path d="M7 7.5h8M7 11.5h8M7 15.5h4.5" stroke="#F3F4F7" stroke-width="1.8" stroke-linecap="round"/><circle cx="19.5" cy="19.5" r="5.5" fill="#E4572E"/><path d="M17 19.6l1.7 1.7 3.2-3.3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    {{NAME}}
  </div>
  <h1>A free invoice generator that knows your country’s rules</h1>
  <p>Taxes, currency, paper size and payment details, set up for your country.</p>
</div>
<div class="stack">
  <div class="tile"><div class="k">Germany <span>EUR, A4</span></div><div class="h">RECHNUNG</div>
    <div class="row"><span>Webdesign</span><span>1.200,00 €</span></div><div class="row"><span>USt. 19%</span><span>228,00 €</span></div>
    <div class="tot" style="background:#2E5BDA"><span>Gesamtbetrag</span><span>1.428,00 €</span></div></div>
  <div class="tile"><div class="k">India <span>INR, GST</span></div><div class="h">TAX INVOICE</div>
    <div class="row"><span>CGST 9% + SGST 9%</span><span>₹1,800.00</span></div>
    <div class="tot" style="background:#7B3FA0"><span>Total</span><span>₹11,800.00</span></div></div>
</div>
</body></html>
